<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Dragon">
  <!-- DeckDam Dragon energy icon: olive-bronze sphere (custom design, in the style of aschefield's symbol sheet,
       which has no Dragon symbol) with the Dragon type glyph redrawn as a vector, in black.
       Dragon type symbol © Pokémon / Nintendo / Creatures / GAME FREAK. -->
  <defs>
    <radialGradient id="dg-sphere" cx="36%" cy="30%" r="74%">
      <stop offset="0" stop-color="#f4ecb4"/>
      <stop offset="0.32" stop-color="#cdb757"/>
      <stop offset="0.72" stop-color="#8e7a26"/>
      <stop offset="1" stop-color="#4d410f"/>
    </radialGradient>
    <linearGradient id="dg-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efc6"/>
      <stop offset="1" stop-color="#3f350b"/>
    </linearGradient>
  </defs>
  <circle cx="20" cy="20" r="18.6" fill="url(#dg-sphere)" stroke="url(#dg-rim)" stroke-width="1.2"/>
  <ellipse cx="14.5" cy="11.5" rx="7" ry="4" fill="#fff" opacity=".25"/>
  <!-- glyph: crescent with a fang (drawing coordinates ~800 px, scaled to the center of the circle) -->
  <path fill="#111" fill-rule="evenodd" transform="translate(20.3 20.4) scale(0.0565) translate(-381 -404)"
    d="M512 238C440 190 360 158 290 168C200 182 140 250 140 330C140 440 230 560 340 615C420 650 540 635 622 550L335 293L378 478C320 455 268 410 256 345C245 270 290 215 360 205C420 198 475 213 512 238Z
       M420 442L432 490L488 505Z"/>
</svg>
