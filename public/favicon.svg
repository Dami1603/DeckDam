<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="ddf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2405f"/>
      <stop offset="1" stop-color="#8a1631"/>
    </linearGradient>
  </defs>
  <!-- carta de atrás -->
  <g transform="rotate(-14 18 21)">
    <rect x="7.5" y="7" width="19" height="27" rx="3" fill="#5a0d20" stroke="#b0203f" stroke-width="1"/>
    <rect x="9.6" y="9.1" width="14.8" height="22.8" rx="1.8" fill="none" stroke="#e2587a" stroke-opacity=".5" stroke-width=".8"/>
  </g>
  <!-- carta de adelante con la DD entrelazada (una D sobre la otra) -->
