name: Update decks

# Every 12 hours (and manually from the Actions tab) runs the scraper and uploads data/decks.json to Vercel Blob.
# The app on Vercel picks up the new data on its own, without redeploying.
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # scraper cache (downloaded pages, translations, sprites and latest decks) between runs
      - name: Restore data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: deckdam-data-${{ github.run_id }}
          restore-keys: deckdam-data-

      - name: Download the published version (if there is no cache)
        run: node scripts/blob.mjs download
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Scrape
        run: node scraper/index.js

      - name: Upload to Vercel Blob
        run: node scripts/blob.mjs upload
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Save data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: deckdam-data-${{ github.run_id }}
